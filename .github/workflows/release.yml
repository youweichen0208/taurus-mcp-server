name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run release:check
      - name: Generate CycloneDX SBOM
        run: npm sbom --workspaces --sbom-format cyclonedx > taurusdb-sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: taurusdb-mcp-${{ github.ref_name }}-sbom
          path: taurusdb-sbom.cdx.json
          if-no-files-found: error
      - run: npm publish --workspace taurusdb-core --provenance --access public
      - run: npm publish --workspace taurusdb-mcp --provenance --access public
