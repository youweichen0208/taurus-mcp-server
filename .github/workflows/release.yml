name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Same gates as CI (Node matrix, audit, packed install, zero-skip MySQL),
  # run against the exact tagged commit.
  gates:
    uses: ./.github/workflows/ci.yml

  build:
    needs: gates
    runs-on: ubuntu-latest
    outputs:
      npm-tag: ${{ steps.meta.outputs.npm-tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Require the tag to point at a commit on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: npm ci
      - name: Verify release metadata
        id: meta
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node scripts/check-versions.mjs "$RELEASE_TAG"
          version="${RELEASE_TAG#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "npm-tag=next" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "npm-tag=latest" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
      - run: npm run build
      - name: Pack release tarballs once
        run: |
          mkdir release
          npm pack --workspace taurusdb-core --workspace taurusdb-mcp --pack-destination release
      - name: Verify the exact tarballs install outside the workspace
        run: node scripts/verify-packed-install.mjs --tarballs release --report release/verification-tarballs.json
      - name: Generate CycloneDX SBOM
        run: npm sbom --workspaces --sbom-format cyclonedx > release/taurusdb-sbom.cdx.json
      - name: Write checksums
        working-directory: release
        run: sha256sum *.tgz taurusdb-sbom.cdx.json > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.ref_name }}
          path: release/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install OIDC-capable npm CLI
        run: npm install --global npm@11.12.1
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ github.ref_name }}
          path: release
      - name: Verify artifact checksums
        working-directory: release
        run: sha256sum --check SHA256SUMS
      - name: Publish taurusdb-core and wait for the registry
        run: node scripts/publish-tarball.mjs "release/taurusdb-core-${{ needs.build.outputs.version }}.tgz" "${{ needs.build.outputs.npm-tag }}"
      - name: Publish taurusdb-mcp and wait for the registry
        run: node scripts/publish-tarball.mjs "release/taurusdb-mcp-${{ needs.build.outputs.version }}.tgz" "${{ needs.build.outputs.npm-tag }}"

  verify-registry:
    needs: [build, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install from npm in a clean directory and run the MCP handshake
        run: |
          mkdir -p release
          # Allow for registry CDN propagation after publish.
          for attempt in 1 2 3 4 5; do
            if node scripts/verify-packed-install.mjs --registry "${{ needs.build.outputs.version }}" --report release/verification-registry.json; then
              exit 0
            fi
            echo "Registry install attempt $attempt failed; retrying in 30s." >&2
            sleep 30
          done
          exit 1
      - name: Confirm the dist-tag
        if: needs.build.outputs.npm-tag == 'latest'
        run: |
          for pkg in taurusdb-core taurusdb-mcp; do
            latest="$(npm view "$pkg" dist-tags.latest)"
            test "$latest" = "${{ needs.build.outputs.version }}" || { echo "$pkg latest is $latest" >&2; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: registry-verification-${{ github.ref_name }}
          path: release/verification-registry.json
          if-no-files-found: error

  github-release:
    needs: [build, verify-registry]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ github.ref_name }}
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: registry-verification-${{ github.ref_name }}
          path: release
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; uploading only missing assets, never replacing existing ones."
            existing="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
            for file in release/*; do
              if ! grep -qxF "$(basename "$file")" <<<"$existing"; then
                gh release upload "$TAG" "$file"
              fi
            done
            exit 0
          fi
          awk -v version="$VERSION" '
            $0 ~ "^## \\[?" version "\\]?" { capture = 1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          flags=(--title "$TAG" --notes-file release-notes.md --verify-tag)
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$TAG" "${flags[@]}" release/*
